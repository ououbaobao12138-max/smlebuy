<!DOCTYPE html>
<html>
<head>
    <title>Debug localStorage</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .section { margin: 20px 0; border: 1px solid #ccc; padding: 10px; }
        .data { background: #f5f5f5; padding: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>LocalStorage Debug</h1>
    <div class="section">
        <h2>Inventory Data</h2>
        <div id="inventory" class="data">Loading...</div>
    </div>
    <div class="section">
        <h2>Keys in localStorage</h2>
        <div id="keys" class="data">Loading...</div>
    </div>
    <button onclick="clearInventory()">Clear Inventory</button>
    <button onclick="resetToDefault()">Reset to Default</button>
    
    <script>
        function showInventory() {
            const inventory = localStorage.getItem('north-form-inventory');
            document.getElementById('inventory').textContent = inventory || 'No inventory data found';
            
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                keys.push(localStorage.key(i));
            }
            document.getElementById('keys').textContent = keys.join('\n');
        }
        
        function clearInventory() {
            localStorage.removeItem('north-form-inventory');
            showInventory();
        }
        
        function resetToDefault() {
            const defaultProducts = [
                {
                    id: 1,
                    name: "Field Shell Jacket",
                    category: "Outerwear",
                    price: 148,
                    tag: "New",
                    image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=900&q=85",
                    tone: "olive",
                    status: "Live"
                },
                {
                    id: 2,
                    name: "Form Runner 02",
                    category: "Footwear",
                    price: 96,
                    tag: "Popular",
                    image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=85",
                    tone: "red",
                    status: "Live"
                }
            ];
            localStorage.setItem('north-form-inventory', JSON.stringify(defaultProducts));
            showInventory();
        }
        
        showInventory();
    </script>
</body>
</html>
